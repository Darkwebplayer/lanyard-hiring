<!-- shown from the first byte until the app mounts (after /api/me): the rail, a page title and, past 1 s, the badge being
     checked in at the centre, because that is what the wait is. The rail badge stays still: one thing moves at a time. -->
<style>
  .boot { display: grid; grid-template-columns: 88px minmax(0, 1fr); min-height: 100dvh; min-width: 960px; background: oklch(0.974 0.004 330); color: oklch(0.24 0.018 330); font-family: "Instrument Sans", system-ui, sans-serif; }
  .boot-rail { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 22px 0 16px; border-right: 1px solid oklch(0.912 0.008 330); }
  .boot-mark { position: relative; width: 30px; height: 36px; border-radius: 9px; background: oklch(0.24 0.018 330); }
  .boot-mark::before { content: ""; position: absolute; top: 6px; left: 50%; translate: -50% 0; width: 12px; height: 4px; border-radius: 4px; background: oklch(0.55 0.21 352); }
  .boot-word { font-size: 11px; font-weight: 700; letter-spacing: 0.02em; margin: -6px 0 14px; }
  .boot-nav { width: 52px; height: 46px; border-radius: 16px; }
  .boot-me { width: 36px; height: 36px; border-radius: 50%; margin-top: auto; }
  .boot-main { position: relative; padding: 28px clamp(20px, 3vw, 40px); }
  .boot-title { width: 180px; height: 30px; }
  .boot-sk { background: linear-gradient(90deg, oklch(0.955 0.005 330) 0 40%, oklch(0.944 0.006 330) 50%, oklch(0.955 0.005 330) 60% 100%) 0 0 / 300% 100%; border-radius: 8px; animation: boot-shimmer 1.4s ease-in-out infinite; }

  /* the check-in: waits 1 s so a quick load never flashes it */
  .boot-stage { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 18px; animation: boot-appear 240ms ease-out 1s both; }
  .boot-hang { display: grid; justify-items: center; transform-origin: 50% 0; animation: boot-present 1s cubic-bezier(.2, .8, .2, 1) 1s both; }
  .boot-strap { width: 2px; height: 44px; margin-bottom: -18px; border-radius: 2px; background: oklch(0.24 0.018 330 / 0.35); }
  .boot-badge { position: relative; width: 56px; height: 68px; border-radius: 16px; overflow: hidden; background: oklch(0.24 0.018 330); box-shadow: 0 8px 24px oklch(0.3 0.04 330 / 0.18); }
  .boot-badge::before { content: ""; position: absolute; z-index: 1; top: 11px; left: 50%; translate: -50% 0; width: 22px; height: 7px; border-radius: 7px; background: oklch(0.55 0.21 352); }
  /* the reader's light runs down the badge face while the app checks who you are */
  .boot-badge::after { content: ""; position: absolute; left: 0; right: 0; top: -10px; height: 10px; opacity: 0; background: linear-gradient(180deg, transparent, oklch(0.98 0 0 / 0.38), transparent); animation: boot-scan 1.8s cubic-bezier(.45, 0, .25, 1) 1.5s infinite; }
  .boot-say { margin: 0; font-size: 15px; font-weight: 500; color: oklch(0.45 0.015 330); }

  @keyframes boot-shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  @keyframes boot-appear { from { opacity: 0; scale: .95; } to { opacity: 1; scale: 1; } }
  @keyframes boot-present { 0% { rotate: 0deg; } 35% { rotate: -6deg; translate: 0 -2px; } 70% { rotate: 3deg; translate: 0 0; } 100% { rotate: 0deg; } }
  @keyframes boot-scan { 0% { top: -10px; opacity: 0; } 15% { opacity: 1; } 65% { top: 68px; opacity: 1; } 66%, 100% { top: 68px; opacity: 0; } }
  @keyframes boot-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes boot-breathe { 50% { opacity: 0.45; } }
  /* no swing, no scan: the badge fades in and its slot breathes, so busy still looks busy */
  @media (prefers-reduced-motion: reduce) {
    .boot-stage { animation: boot-fade 240ms linear 1s both; }
    .boot-hang, .boot-badge::after { animation: none; }
    .boot-badge::before { animation: boot-breathe 1.6s ease-in-out infinite; }
    .boot-sk { animation: none; }
  }
  /* sign-in and candidate pages have no rail and no check-in */
  .boot.bare { display: block; min-width: 0; }
  .boot.bare .boot-rail, .boot.bare .boot-stage, .boot.bare.status .boot-title { display: none; }
  /* the candidate's status page: no rail, but the badge, since the wait is us finding their applications */
  .boot.bare.status .boot-main { min-height: 100dvh; }
  .boot.bare.status .boot-stage { display: grid; }
</style>
<div class="boot">
  <div class="boot-rail" aria-hidden="true">
    <span class="boot-mark"></span><span class="boot-word">Lanyard</span>
    <span class="boot-nav boot-sk"></span><span class="boot-nav boot-sk"></span><span class="boot-nav boot-sk"></span><span class="boot-nav boot-sk"></span>
    <span class="boot-me boot-sk"></span>
  </div>
  <div class="boot-main">
    <div class="boot-title boot-sk" aria-hidden="true"></div>
    <div class="boot-stage">
      <div class="boot-hang" aria-hidden="true"><span class="boot-strap"></span><span class="boot-badge"></span></div>
      <p class="boot-say" role="status">Checking you in…</p>
    </div>
  </div>
</div>
<script>
  var boot = document.querySelector('.boot')
  if (/^\/(login|book\/|offer\/|documents\/|status\/)/.test(location.pathname)) boot.classList.add('bare')
  if (/^\/status\//.test(location.pathname)) {
    boot.classList.add('status')
    boot.querySelector('.boot-say').textContent = 'Finding your applications…'
  }
</script>
